[project]
name = "frozen-prompt-transfer"
version = "0.1.0"
description = "Auditable experiments for frozen prompt transfer"
requires-python = ">=3.10"

[project.scripts]
frozen-prompt-source-cell = "pe2_btape.formal_cell:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pe2_btape"]
